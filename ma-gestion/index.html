<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma gestion de projets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="../shared/pp-acces.js"></script>
<script src="../shared/pp-signalement.js" defer></script>
<script src="../shared/retour-accueil.js" defer></script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#fafbfc;
  --border:#e4e7ec; --border2:#cfd5de;
  --text:#1b2232; --text2:#5a6577; --text3:#8e98a8;
  --orange:#F07B1F; --orange-bg:#FDF1E6;
  --ppblue:#17697A; --ppblue-bg:#E6F2F4;
  --rouge:#A32D2D; --rouge-bg:#FCEBEB; --rouge-l:#C94B4B;
  --ambre:#854F0B; --ambre-bg:#FAEEDA; --ambre-l:#D89B3A;
  --bleuf:#2F5273; --bleuf-bg:#EAF0F6; --bleuf-l:#5A7FA3;
  --vert:#3B6D11;  --vert-bg:#EAF3DE;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}

header{background:var(--surface);height:52px;display:flex;align-items:center;gap:14px;
  padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.logo-text{display:flex;align-items:center;font-size:13px;font-weight:600}
.logo-text .lt{color:var(--text)}.logo-text .ls{color:var(--border2);margin:0 4px}
.logo-text .lo{color:var(--orange)}
.vbadge{font-size:10px;color:var(--text3);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px;font-family:var(--mono)}
.spacer{flex:1}
.moi{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 6px 4px 12px;font-size:12px}
.moi .nom{color:var(--text);font-weight:600}
.moi button{background:transparent;border:none;color:var(--text3);font-size:11px;cursor:pointer;
  padding:3px 8px;border-radius:14px}
.moi button:hover{background:#eef1f5;color:var(--text2)}
.score{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.score b{color:var(--vert);font-size:15px;font-family:var(--mono)}

.wrap{max-width:min(96vw,1800px);margin:0 auto;padding:20px 20px 70px}

/* choix de la personne */
.portail{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:26px;box-shadow:0 1px 3px rgba(20,30,50,.06)}
.portail h1{margin:0 0 6px;font-size:17px}
.portail p{margin:0 0 18px;color:var(--text2);font-size:12.5px;line-height:1.6}
.qui{display:flex;flex-direction:column;gap:8px}
.qui button{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;
  text-align:left;color:var(--text);font-family:var(--sans)}
.qui button:hover{border-color:var(--orange);background:var(--orange-bg)}
.qui .ini{font-family:var(--mono);font-size:11px;color:var(--text3);
  background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}

.resume{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:9px 14px;font-size:12px;color:var(--text2)}
.chip b{font-family:var(--mono);font-size:15px;color:var(--text)}
.chip.r b{color:var(--rouge)} .chip.a b{color:var(--ambre)} .chip.b b{color:var(--bleuf)}

.grille{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:1100px){.grille{grid-template-columns:1fr}}

section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.shead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.shead h2{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.3px;flex:1}
.shead i.ico{font-size:17px}
.t-ok h2,.t-ok i.ico{color:var(--ppblue)}
.t-crit h2,.t-crit i.ico{color:var(--orange)}
.t-urg h2,.t-urg i.ico{color:var(--rouge)}
.cpt{font-family:var(--mono);font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.c-ok{background:var(--ppblue-bg);color:var(--ppblue)}
.c-crit{background:var(--ambre-bg);color:var(--ambre)}
.c-urg{background:var(--rouge-bg);color:var(--rouge)}
.repart{display:flex;height:7px;width:86px;border-radius:4px;overflow:hidden;background:#eef1f5}
.repart span{display:block;height:100%}
.sp-r{background:var(--rouge-l)} .sp-a{background:var(--ambre-l)} .sp-b{background:var(--bleuf-l)}
.vide{padding:16px 14px;color:var(--vert);font-size:12px;display:flex;align-items:center;gap:8px}

.row{position:relative;padding:10px 12px 10px 16px;border-bottom:1px solid #f0f2f5;
  transition:opacity .4s ease,transform .4s ease,max-height .4s ease;max-height:460px;overflow:hidden}
.row:last-of-type{border-bottom:none}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.row.rouge::before{background:var(--rouge-l)}  .row.rouge{background:#fffafa}
.row.orange::before{background:var(--ambre-l)} .row.orange{background:#fffdf8}
.row.bleu::before{background:var(--bleuf-l)}
.row.gris::before{background:var(--border2)}
.row.parti{opacity:0;transform:translateX(26px);max-height:0;padding-top:0;padding-bottom:0;border:none}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.l1 .so{font-family:var(--mono);font-size:12px;font-weight:700}
.l1 .cli{color:var(--text2);font-size:12px}
.l1 .sep{color:var(--border2)}
.l1 .badge{margin-left:auto}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;
  color:#fff;white-space:nowrap}
.b-rouge{background:var(--rouge)} .b-orange{background:var(--ambre)}
.b-bleu{background:var(--bleuf)} .b-gris{background:#6b7280}
.l2{display:flex;align-items:center;gap:8px;margin-top:6px}
.l2 .quoi{font-size:12px;color:var(--text2);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;flex-shrink:0}
.p-rouge{background:var(--rouge-bg);color:var(--rouge)}
.p-orange{background:var(--ambre-bg);color:var(--ambre)}
.p-bleu{background:var(--bleuf-bg);color:var(--bleuf)}
.p-gris{background:#eef1f5;color:var(--text2)}
.p-vert{background:var(--vert-bg);color:var(--vert)}
.acts{display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn-p{padding:5px 11px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);
  font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;
  display:inline-block;font-family:var(--sans)}
.btn-p:hover{background:#d96c15}
.btn-s{padding:5px 11px;background:var(--surface);color:var(--text2);border:1px solid var(--border);
  border-radius:var(--radius);font-size:11.5px;cursor:pointer;white-space:nowrap;text-decoration:none;
  display:inline-block;font-family:var(--sans)}
.btn-s:hover{border-color:var(--border2);color:var(--text)}
.detail{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:11.5px;color:var(--text2);line-height:1.6}
.row.ouverte .detail{display:block}
.detail .geste{color:var(--text);margin-top:4px}
.detail .refs{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px}
.detail .acts2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.lien{font-size:11px;color:var(--text3);text-decoration:none;border-bottom:1px dotted var(--border2);
  padding-bottom:1px;margin-left:4px}
.lien:hover{color:var(--ppblue);border-bottom-color:var(--ppblue)}
.shead{cursor:pointer}
.shead h2::after{content:" ▾";color:var(--text3);font-size:10px}
section.replie .shead h2::after{content:" ▸"}
section.replie .row,section.replie .vide,section.replie .plus{display:none}
.plus{display:block;width:100%;text-align:center;padding:8px;background:var(--surface2);
  border:none;border-top:1px solid var(--border);color:var(--text2);font-size:11px;
  cursor:pointer;font-weight:600;font-family:var(--sans)}
.plus:hover{color:var(--orange)}
.cache{display:none}

/* tuiles applis */
.outils{margin-top:26px}
.outils h3{font-size:11px;letter-spacing:.06em;color:var(--text3);font-weight:700;margin:0 0 10px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.tuile{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:13px 15px;text-decoration:none;color:var(--text);
  box-shadow:0 1px 2px rgba(20,30,50,.04)}
.tuile:hover{border-color:var(--orange)}
.tuile i{font-size:20px;color:var(--orange)}
.tuile .tt{font-size:12.5px;font-weight:600}
.tuile .ts{font-size:11px;color:var(--text3);margin-top:1px}

.msg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;color:var(--text2);font-size:12.5px;line-height:1.6}
.msg.err{border-left:4px solid var(--rouge)}
.bientot{margin-top:18px;background:var(--ppblue-bg);border:1px solid #cfe3e7;border-radius:var(--radius-lg);
  padding:13px 16px;color:var(--ppblue);font-size:12px;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--vert);color:#fff;font-weight:600;font-size:12.5px;
  padding:10px 20px;border-radius:24px;transition:transform .3s ease;z-index:99;
  box-shadow:0 4px 14px rgba(20,40,10,.2)}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <img src="../shared/picto-pp.png" alt="" width="24" height="24" style="object-fit:contain"
       onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Ma gestion de projets</span></span>
  <span class="vbadge" id="vbadge"></span>
  <span class="spacer"></span>
  <span class="score" id="zscore" style="display:none"><i class="ti ti-check"></i> traités aujourd'hui <b id="score">0</b></span>
  <span class="moi" id="zmoi" style="display:none">
    <span class="nom" id="monnom"></span>
    <button onclick="changerDePersonne()">ce n'est pas moi</button>
  </span>
</header>

<div class="wrap" id="app"></div>
<div class="toast" id="toast">Traité</div>

<script>
/* ------------------------------------------------------------------ *
 * Ma gestion de projets — page de suivi par personne.
 *
 * Elle n'invente aucune règle : tout ce qu'elle affiche vient du service
 * « PP — Points a traiter », qui est aussi ce que lit le point du matin.
 * Une règle changée dans le service vaut pour le mail ET pour cette page.
 *
 * Entrée (décision Olivier du 29/10/2026) :
 *   - depuis le mail : le lien porte ?j=<jeton>, qui dit QUI tu es
 *   - depuis le hub  : le code d'accès PP ouvre la page, puis on choisit son nom
 *   - le code d'accès PP est exigé dans les deux cas : c'est lui qui protège
 *     les données client (NDA). Le jeton seul n'ouvre rien.
 * ------------------------------------------------------------------ */
const APP_VERSION = "1.4";
const APP_DATE    = "30/10/2026";
document.getElementById('vbadge').textContent = "v" + APP_VERSION + " — " + APP_DATE;
document.title = "Ma gestion de projets v" + APP_VERSION;

const SERVICE  = 'https://protoprocess.app.n8n.cloud/webhook/pp-points-a-traiter';
const SOURDINE = 'https://protoprocess.github.io/achats/sourdine/';
const GMAIL    = 'https://mail.google.com/mail/u/0/#inbox/';
const RACINE   = 'https://protoprocess.github.io/';
const CLE_MOI  = 'pp_ma_gestion_qui';

/* Les pôles, tels qu'Ariel les a décrits le 20/10/2026. Les adresses et les
   libellés sont repris du hub, pour que personne n'ait à réapprendre un nom. */
const POLES = {
  direction:         { nom: 'Direction',            outils: ['devis','commande','achats','po','fabstory','methodes','paie'] },
  commercial_achats: { nom: 'Commercial et achats',  outils: ['devis','commande','achats','po','fabstory'] },
  production:        { nom: 'Gestion de production', outils: ['fabstory','methodes'] },
  methodes:          { nom: 'Méthodes',              outils: ['methodes','fabstory'] }
};

const OUTILS = {
  devis:     { t: 'Créer un devis',        s: "Dossier client jusqu'au devis Odoo", i: 'ti-file-text',       u: 'commercial/devis-client/' },
  commande:  { t: 'Commande client',       s: "Bon de commande reçu d'un client",   i: 'ti-clipboard-check', u: 'commercial/commande/' },
  achats:    { t: 'Approvisionner',        s: 'Achats PP',                          i: 'ti-shopping-cart',   u: 'achats/bom-sourcing/' },
  po:        { t: "Commande d'achat",      s: 'P.O. fournisseur dans Odoo',         i: 'ti-receipt',         u: 'achats/po-odoo/' },
  fabstory:  { t: 'Suivre une fabrication',s: 'FabStory',                           i: 'ti-timeline',        u: 'commercial/fabstory/' },
  methodes:  { t: 'Préparer un dossier',   s: 'MYCenter Prep',                      i: 'ti-settings',        u: 'methodes-production/methodes/' },
  paie:      { t: 'Paie',                  s: 'Heures et congés',                   i: 'ti-calendar',        u: 'rh/paie/' }
};

const POLE_DE = { OC: 'direction', MM: 'commercial_achats', DG: 'commercial_achats',
                  AC: 'commercial_achats', FR: 'production', JE: 'methodes' };

let DONNEES = null;   // réponse du service
let MOI = null;       // initiales choisies
let traites = 0;

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]);
const frDate = iso => { const s = String(iso || ''); return s.length >= 10 ? s.slice(8,10) + '/' + s.slice(5,7) : ''; };

/* ---------- appel du service ---------- */
async function charger() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture en cours…</div>';
  try {
    const r = await fetch(SERVICE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'ma-gestion-de-projets', version: APP_VERSION })
    });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const data = await r.json();
    DONNEES = Array.isArray(data) ? data : (data.responsables || data.data || []);
    if (!Array.isArray(DONNEES)) DONNEES = [DONNEES];
    demarrer();
  } catch (e) {
    app.innerHTML = '<div class="msg err"><strong>La lecture n a pas abouti.</strong><br>'
      + esc(e.message) + '<br><br>Si le code d accès vient d être saisi, recharge la page. '
      + 'Si ça recommence, dis-le : ce n est pas à toi de deviner.</div>';
  }
}

/* ---------- qui es-tu ---------- */
function demarrer() {
  const url = new URLSearchParams(location.search);
  const jeton = url.get('j');
  // ?qui=MM force la personne sans rien memoriser : c est ce qu il faut pour un ecran
  // d affichage, ou pour regarder la page d un collegue depuis son propre poste sans
  // ecraser son propre choix.
  const force = (url.get('qui') || '').toUpperCase();
  if (force && DONNEES.some(d => d.initiales === force)) { MOI = force; rendre(); return; }
  // Le jeton du mail porte l identité : on cherche à qui il appartient.
  if (jeton) {
    const trouve = DONNEES.find(d => (d.affaires_a_geste || []).concat(d.affaires_calmes || [])
      .some(a => a.jeton === jeton));
    if (trouve) { choisir(trouve.initiales); return; }
  }
  const garde = localStorage.getItem(CLE_MOI);
  if (garde && DONNEES.some(d => d.initiales === garde)) { choisir(garde); return; }
  portail();
}

function portail() {
  document.getElementById('zmoi').style.display = 'none';
  document.getElementById('zscore').style.display = 'none';
  const gens = DONNEES.filter(d => d.initiales).sort((a,b) => a.nom.localeCompare(b.nom));
  let h = '<div class="portail"><h1>Qui es-tu ?</h1>';
  h += '<p>Une seule fois sur ce poste. Tu pourras changer à tout moment avec « ce n est pas moi ».</p>';
  h += '<div class="qui">';
  for (const g of gens) {
    const n = (g.compteurs || {}).total || 0;
    h += '<button onclick="choisir(\'' + esc(g.initiales) + '\')">'
       + '<span class="ini">' + esc(g.initiales) + '</span>'
       + '<span>' + esc(g.nom) + '</span>'
       + '<span style="margin-left:auto;color:var(--text3);font-size:11px">' + n + ' point' + (n > 1 ? 's' : '') + '</span>'
       + '</button>';
  }
  h += '</div></div>';
  document.getElementById('app').innerHTML = h;
}

function choisir(ini) {
  MOI = ini;
  try { localStorage.setItem(CLE_MOI, ini); } catch (e) {}
  rendre();
}
function changerDePersonne() {
  try { localStorage.removeItem(CLE_MOI); } catch (e) {}
  MOI = null;
  portail();
}

/* ---------- la page ---------- */
function rendre() {
  const d = DONNEES.find(x => x.initiales === MOI);
  document.getElementById('monnom').textContent = d ? d.nom : MOI;
  document.getElementById('zmoi').style.display = '';
  document.getElementById('zscore').style.display = '';

  const c = (d && d.compteurs) || {};
  let h = '<div class="resume">';
  h += chip('r', c.rouge || 0, 'en danger');
  h += chip('a', c.orange || 0, 'à surveiller');
  h += chip('b', c.bleu || 0, 'information manquante');
  h += chip('', c.devis || 0, 'devis à traiter');
  h += '</div>';

  h += '<div class="grille">';
  h += blocAffaires(d);
  h += blocDevis(d);
  h += '</div>';

  h += '<div class="bientot"><strong>Bientôt ici :</strong> tes commandes fournisseur sans accusé de '
     + 'réception, tes commandes à facturer, et les courbes (ta pile, tes devis dans les temps, tes '
     + 'livraisons à l heure). Les mesures ont commencé aujourd hui — elles deviendront lisibles au '
     + 'fil des jours.</div>';

  h += outils();
  document.getElementById('app').innerHTML = h;
}

function chip(cl, n, lib) {
  return '<div class="chip ' + cl + '"><b>' + n + '</b> ' + lib + '</div>';
}

function entete(cls, ico, titre, n, rep) {
  // L en-tete entier est cliquable : il replie le bloc. Un bloc traite ne doit pas
  // occuper l ecran de ceux qui restent.
  let h = '<div class="shead ' + cls + '" onclick="plierBloc(this)" title="Replier ce bloc">';
  h += '<h2>' + titre + '</h2>';
  if (rep) h += rep;
  h += '<span class="cpt ' + (cls === 't-urg' ? 'c-urg' : cls === 't-crit' ? 'c-crit' : 'c-ok') + '">' + n + '</span></div>';
  return h;
}

function repartition(aff) {
  const t = aff.length; if (!t) return '';
  const r = aff.filter(a => a.niveau === 'rouge').length;
  const o = aff.filter(a => a.niveau === 'orange').length;
  const b = t - r - o;
  return '<span class="repart">'
    + '<span class="sp-r" style="width:' + (r/t*100) + '%"></span>'
    + '<span class="sp-a" style="width:' + (o/t*100) + '%"></span>'
    + '<span class="sp-b" style="width:' + (b/t*100) + '%"></span></span>';
}

function blocAffaires(d) {
  const aff = (d && d.affaires_a_geste) || [];
  const calmes = (d && d.affaires_calmes) || [];
  const pire = aff.some(a => a.niveau === 'rouge') ? 't-urg'
             : aff.length ? 't-crit' : 't-ok';
  let h = '<section id="bloc-appro">';
  h += entete(pire, 'ti-alert-triangle', 'CE QUI ATTEND UN GESTE', aff.length, repartition(aff));
  if (!aff.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Rien à faire ici. Tout est à jour.</div>';
  } else {
    h += aff.map(a => ligneAffaire(a, false)).join('');
  }
  if (calmes.length) {
    h += calmes.map(a => ligneAffaire(a, true)).join('');
    h += '<button class="plus" onclick="deplier(this)">Voir les ' + calmes.length
       + ' affaire' + (calmes.length > 1 ? 's' : '') + ' à garder à l œil ▾</button>';
  }
  h += '</section>';
  return h;
}

function ligneAffaire(a, calme) {
  const niv = calme ? 'gris' : a.niveau;
  const b0 = (a.blocs && a.blocs[0]) || {};
  // Le service fournit « resume » deja formule : avec un nombre pour ce qui se compte en
  // references, sans nombre pour les faits uniques. La page ne recompose rien — sinon on
  // relit « 1 rien de lance ».
  const resume = a.blocs.map(b => b.resume || b.libelle).join(' · ');
  let h = '<div class="row ' + niv + (calme ? ' cache sup' : '') + '">';
  h += '<div class="l1"><span class="so">' + esc(a.so) + '</span>';
  if (a.client) h += '<span class="sep">·</span><span class="cli">' + esc(a.client) + '</span>';
  h += '<span class="badge b-' + niv + '">' + esc(a.badge) + '</span></div>';

  h += '<div class="l2"><span class="pastille p-' + niv + '">' + esc(b0.titre || b0.libelle || '') + '</span>';
  // Retour en stock constate par le check Luminovo (8h et 14h) ou le balayage large.
  // Ne se voit sans deplier que si la piece est reellement ACHETABLE : un stock partiel
  // ne debloque pas l affaire et n a donc rien a faire sur la premiere ligne.
  const retAch = (a.retours || []).filter(r => r.achetable);
  if (retAch.length) {
    h += '<span class="pastille p-vert">' + retAch.length + ' revenue'
       + (retAch.length > 1 ? 's' : '') + ' en stock</span>';
  }
  h += '<span class="quoi">' + esc(resume) + '</span>';
  h += '<span class="acts">';
  h += '<a class="btn-p" href="' + RACINE + 'achats/bom-sourcing/">Je m en occupe</a>';
  h += '<button class="btn-s" onclick="aide(event)">Aide</button>';
  h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
  h += '</span></div>';

  h += '<div class="detail">';
  if (a.carte) h += esc(a.carte);
  if (a.arc) h += ' · livraison promise le ' + frDate(a.arc);
  for (const b of (a.blocs || [])) {
    h += '<div style="margin-top:8px">';
    h += '<span class="pastille p-' + (b.niveau || niv) + '">' + esc(b.titre || b.libelle) + '</span>';
    const refs = (b.refs_rouges && b.refs_rouges.length ? b.refs_rouges : b.refs) || [];
    if (refs.length) {
      h += refs.slice(0,3).map(r => '<div class="refs">' + esc(r) + '</div>').join('');
      if (refs.length > 3) h += '<div class="refs">+ ' + (refs.length - 3) + ' autres</div>';
    }
    if (b.fournisseur) h += '<div class="refs">chez ' + esc(b.fournisseur) + '</div>';
    if (b.jours_au_panier != null) h += '<div class="refs">au panier depuis ' + b.jours_au_panier + ' jours</div>';
    if (b.question_depuis) h += '<div class="refs">question au client ouverte depuis le ' + frDate(b.question_depuis) + '</div>';
    if (b.motif) h += '<div class="refs">' + esc(b.motif) + '</div>';
    if (b.geste) h += '<div class="geste">' + esc(b.geste) + '</div>';
    h += '</div>';
  }
  // Le detail dit CHEZ QUI la piece est revenue — ce que le mail Luminovo ne disait jamais.
  if (a.retours && a.retours.length) {
    h += '<div style="margin-top:8px">';
    h += '<span class="pastille p-vert">retour en stock</span>';
    for (const r of a.retours) {
      const ou = esc(r.fournisseur || '?');
      h += '<div class="refs">' + esc(r.mpn) + ' — ' + (r.achetable
        ? 'commandable chez ' + ou + (r.ref_fournisseur ? ' (réf ' + esc(r.ref_fournisseur) + ')' : '')
        : 'seulement ' + r.stock + ' chez ' + ou + ' pour ' + r.besoin + ' nécessaires')
        + (r.vu_le ? ' · vu le ' + frDate(r.vu_le) : '') + '</div>';
    }
    if (retAch.length) {
      h += '<div class="geste">Les références commandables ont déjà été remises à jour dans la feuille '
         + 'Paniers en attente : le fournisseur et la référence y sont inscrits, la ligne est repartie '
         + 'dans le panier.</div>';
    } else {
      h += '<div class="geste">Le stock trouvé ne couvre pas le besoin : rien n a été inscrit dans la '
         + 'feuille. À toi de voir s il faut prendre ce qu il y a, chercher un équivalent, ou attendre.</div>';
    }
    h += '</div>';
  }
  h += '<div class="acts2">';
  if (a.jeton) h += '<a class="btn-s" href="' + SOURDINE + '?j=' + esc(a.jeton) + '">C est normal, mettre en sourdine</a>';
  // Les trois endroits ou une affaire se traite reellement. FabStory ouvre LA carte
  // (?produit=), pas la liste. Luminovo n existe que sur un tiers des affaires.
  if (a.lien_fabstory) h += '<a class="lien" target="_blank" href="' + esc(a.lien_fabstory) + '">FabStory</a>';
  if (a.lien_odoo) h += '<a class="lien" target="_blank" href="' + esc(a.lien_odoo) + '">Odoo</a>';
  if (a.lien_luminovo) h += '<a class="lien" target="_blank" href="' + esc(a.lien_luminovo) + '">Luminovo</a>';
  h += '</div></div></div>';
  return h;
}

function blocDevis(d) {
  const devis = (d && d.devis) || [];
  const cls = devis.length ? 't-crit' : 't-ok';
  let h = '<section>';
  h += entete(cls, 'ti-file-text', 'MES DEVIS À TRAITER', devis.length, '');
  if (!devis.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Rien à faire ici. Tout est à jour.</div>';
  } else {
    for (const v of devis) {
      const relance = v.type === 'devis_relance';
      h += '<div class="row ' + (relance ? 'orange' : 'bleu') + '">';
      h += '<div class="l1"><span class="cli">' + esc(v.client) + '</span>';
      h += '<span class="badge b-' + (relance ? 'orange' : 'bleu') + '">' + v.jours + ' j</span></div>';
      h += '<div class="l2"><span class="pastille p-' + (relance ? 'orange' : 'bleu') + '">'
         + (relance ? 'sans réponse du client' : 'pas encore lu') + '</span>';
      h += '<span class="quoi">' + esc(v.objet) + '</span>';
      h += '<span class="acts">';
      h += '<a class="btn-p" href="' + GMAIL + esc(v.thread_id) + '">Ouvrir le mail</a>';
      h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
      h += '</span></div>';
      h += '<div class="detail">reçu le ' + frDate(v.recu_le);
      h += '<div class="geste">' + esc(v.geste) + '</div></div></div>';
    }
  }
  h += '</section>';
  return h;
}

function outils() {
  const pole = POLES[POLE_DE[MOI] || 'commercial_achats'];
  let h = '<div class="outils"><h3>MES OUTILS — ' + esc(pole.nom.toUpperCase()) + '</h3><div class="tuiles">';
  for (const k of pole.outils) {
    const o = OUTILS[k]; if (!o) continue;
    h += '<a class="tuile" href="' + RACINE + o.u + '">';
    h += '<i class="ti ' + o.i + '"></i><div><div class="tt">' + esc(o.t) + '</div>';
    h += '<div class="ts">' + esc(o.s) + '</div></div></a>';
  }
  h += '</div></div>';
  return h;
}

/* ---------- interactions ---------- */
function plierBloc(head) {
  head.closest('section').classList.toggle('replie');
}
function plier(btn) {
  const r = btn.closest('.row');
  const ouvert = r.classList.toggle('ouverte');
  btn.textContent = ouvert ? 'Replier' : 'Détail';
}
function deplier(btn) {
  btn.closest('section').querySelectorAll('.sup').forEach(r => r.classList.remove('cache'));
  btn.remove();
}
function aide(e) {
  e.stopPropagation();
  alert("L aide de Claude sur une ligne arrive dans la prochaine version.\n"
      + "En attendant, le bouton « Demander de l aide à Claude » de l appli Achats PP fait déjà le travail.");
}
function toast(txt) {
  const t = document.getElementById('toast');
  t.textContent = txt; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
}

charger();
</script>
</body>
</html>
